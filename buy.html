<script>
  document.querySelectorAll('#default-tab button').forEach(button => {
    button.addEventListener('click', () => {
      // Barcha kontentlarni yashirish
      document.querySelectorAll('#default-tab-content > div').forEach(content => {
        content.classList.add('hidden');
        content.classList.remove('block');
      });

      // Barcha tugmalarni nofaol holatga keltirish
      document.querySelectorAll('#default-tab button').forEach(btn => {
        btn.classList.replace('border-brand', 'border-transparent');
        btn.classList.replace('opacity-100', 'opacity-60');
        btn.setAttribute('aria-selected', 'false');
      });

      // Bosilgan tugmani faollashtirish
      const targetId = button.getAttribute('data-target');
      const targetContent = document.querySelector(targetId);
      
      targetContent.classList.remove('hidden');
      targetContent.classList.add('block');
      
      button.classList.replace('border-transparent', 'border-brand');
      button.classList.replace('opacity-60', 'opacity-100');
      button.setAttribute('aria-selected', 'true');
    });
  });
</script>
